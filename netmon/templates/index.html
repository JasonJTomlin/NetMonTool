<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Network Monitor</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #5f6b7a; --border: #e2e5ea;
    --accent: #2563eb; --online: #16a34a; --offline: #9aa3ae; --new: #d97706; --danger: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #8b95a3; --border: #262c35;
      --accent: #60a5fa; --online: #22c55e; --offline: #5b6470; --new: #f59e0b; --danger: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 15px; margin: 28px 0 10px; }
  .sub { color: var(--muted); font-size: 13px; }
  button { font: inherit; border: 1px solid var(--border); background: var(--panel); color: var(--text);
           padding: 7px 14px; border-radius: 8px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .6; cursor: default; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }

  .conn { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .conn .panel { padding: 12px 16px; display: flex; align-items: center; gap: 14px; }
  .conn .what { font-weight: 600; }
  .conn .stats { color: var(--muted); font-size: 13px; }
  .conn svg { margin-left: auto; flex-shrink: 0; }
  .conn .down .what { color: var(--danger); }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px;
          cursor: pointer; text-align: left; }
  .card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .card .n { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .card .l { color: var(--muted); font-size: 13px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; position: relative; }
  .colmenu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 10; width: min(300px, calc(100vw - 32px));
             padding: 12px; box-shadow: 0 8px 24px rgb(0 0 0 / .2); }
  .colmenu ul { list-style: none; margin: 8px 0 12px; padding: 0; }
  .colmenu li { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 6px; }
  .colmenu li:hover { background: var(--bg); }
  .colmenu li.dragging { opacity: .4; }
  .colmenu li.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
  .colmenu li.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
  .colmenu .handle { cursor: grab; color: var(--muted); user-select: none; padding: 0 2px; }
  .colmenu label { flex: 1; display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .colmenu label small { color: var(--muted); }
  .colmenu .move { padding: 1px 7px; font-size: 10px; }
  .colmenu .foot { display: flex; justify-content: space-between; }
  td.chevcell, th.chevcell { width: 1%; padding-right: 0; }
  input[type=search], input[type=url] { flex: 1; min-width: 180px; font: inherit; padding: 7px 10px; border-radius: 8px;
                       border: 1px solid var(--border); background: var(--panel); color: var(--text); }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 10px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  th button.sort { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
  th button.sort:hover, th[aria-sort=ascending] button.sort, th[aria-sort=descending] button.sort { color: var(--text); }
  th button.sort:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  th .arrow { font-size: 9px; min-width: 9px; }
  tr:last-child td { border-bottom: 0; }
  tr.off td { color: var(--muted); }
  .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 13px; }
  .num { font-variant-numeric: tabular-nums; }
  .status { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--offline); flex-shrink: 0; }
  .on .dot, .dot.on { background: var(--online); box-shadow: 0 0 0 3px color-mix(in srgb, var(--online) 25%, transparent); }
  .dot.down { background: var(--danger); }
  .badge { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; margin-left: 6px; }
  .badge.new { background: color-mix(in srgb, var(--new) 18%, transparent); color: var(--new); }
  .badge.me { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  .badge.priv { background: color-mix(in srgb, var(--muted) 18%, transparent); color: var(--muted); }
  .name { white-space: normal; min-width: 200px; }
  .name input { font: inherit; color: var(--text); background: transparent; border: 1px solid transparent;
                border-radius: 6px; padding: 3px 6px; margin-left: -7px; width: 100%; min-width: 150px; text-overflow: ellipsis; }
  .name input:hover, .name input:focus { border-color: var(--border); background: var(--bg); outline: none; }
  .host { color: var(--muted); font-size: 12px; white-space: normal; }
  tr.dev { cursor: pointer; }
  tr.dev:hover td { background: color-mix(in srgb, var(--accent) 4%, transparent); }
  .chev { display: inline-block; width: 12px; color: var(--muted); transition: transform .15s; }
  tr.open .chev { transform: rotate(90deg); }
  tr.details td { background: var(--bg); white-space: normal; padding: 14px 16px 16px 32px; }
  .details-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 24px; }
  @media (max-width: 760px) { .details-grid { grid-template-columns: 1fr; } }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0; }
  dt { color: var(--muted); font-size: 13px; }
  dd { margin: 0; word-break: break-word; }
  .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; margin: 0 0 6px; }
  .uptime { display: flex; gap: 24px; margin-bottom: 14px; }
  .uptime b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .actions { text-align: right; }
  .actions button { padding: 3px 9px; font-size: 12px; margin-left: 4px; }
  .actions button.forget:hover { border-color: var(--danger); color: var(--danger); }
  button.bell { padding: 3px 7px; line-height: 0; color: var(--muted); }
  button.bell[aria-pressed=true] { color: var(--new); border-color: color-mix(in srgb, var(--new) 50%, transparent);
                                   background: color-mix(in srgb, var(--new) 12%, transparent); }
  .empty { padding: 40px; text-align: center; color: var(--muted); }

  .events { list-style: none; margin: 0; padding: 0; }
  .events li { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-bottom: 1px solid var(--border); }
  .events li:last-child { border-bottom: 0; }
  .events .when { color: var(--muted); font-size: 13px; margin-left: auto; white-space: nowrap; }
  .compact li { padding: 4px 0; border: 0; }

  dialog { border: 1px solid var(--border); border-radius: 12px; background: var(--panel); color: var(--text);
           padding: 20px 22px; width: min(460px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgb(0 0 0 / .4); }
  dialog h3 { margin: 0 0 14px; font-size: 16px; }
  dialog label.check { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
  dialog label.check span small { display: block; color: var(--muted); font-size: 12px; }
  dialog .field { margin: 16px 0 6px; }
  dialog .field input { width: 100%; }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  dialog .row .left { margin-right: auto; }
  #testResult { color: var(--muted); font-size: 13px; align-self: center; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Network Monitor</h1>
      <div class="sub" id="meta">Loading…</div>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap">
      <button id="settingsBtn">Alerts…</button>
      <button id="ackAll">Mark all seen</button>
      <button class="primary" id="scanBtn">Scan now</button>
    </div>
  </header>

  <div class="conn">
    <div class="panel" id="internet"></div>
    <div class="panel" id="router"></div>
  </div>

  <div class="cards">
    <button class="card active" data-filter="all"><div class="n" id="cAll">–</div><div class="l">Known devices</div></button>
    <button class="card" data-filter="online"><div class="n" id="cOn">–</div><div class="l">Online</div></button>
    <button class="card" data-filter="offline"><div class="n" id="cOff">–</div><div class="l">Offline</div></button>
    <button class="card" data-filter="new"><div class="n" id="cNew">–</div><div class="l">New devices</div></button>
    <button class="card" data-filter="watched"><div class="n" id="cWatch">–</div><div class="l">Watched</div></button>
  </div>

  <div class="toolbar">
    <input type="search" id="q" placeholder="Filter by name, maker, model, IP or MAC">
    <button id="colBtn" aria-haspopup="true" aria-expanded="false" aria-controls="colMenu">Columns</button>
    <div class="panel colmenu" id="colMenu" hidden>
      <div class="sub">Tick to show. Drag ⠿ or use the arrows to reorder.</div>
      <ul id="colList"></ul>
      <div class="foot"><button id="colReset">Reset to default</button><button id="colDone" class="primary">Done</button></div>
    </div>
  </div>

  <div class="panel table-wrap">
    <table>
      <thead><tr id="headRow"></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>No devices match.</div>
  </div>

  <h2>Recent activity</h2>
  <div class="panel"><ul class="events" id="activity"></ul></div>
</main>

<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <h3>Alerts</h3>
    <label class="check"><input type="checkbox" name="notify_new"><span>New devices<small>When a device joins that hasn't been seen before.</small></span></label>
    <label class="check"><input type="checkbox" name="notify_offline"><span>Watched devices go offline<small>Turn on per device with the bell. Fires after 2 missed scans in a row, and again when it's back.</small></span></label>
    <label class="check"><input type="checkbox" name="notify_internet"><span>Internet connection drops<small>When 1.1.1.1 and 8.8.8.8 stop answering, and when they're back.</small></span></label>
    <div class="label" style="margin-top:18px">Send alerts to</div>
    <label class="check"><input type="checkbox" name="notify_desktop"><span>Desktop notifications</span></label>
    <div class="field">
      <div class="sub" style="margin-bottom:4px">Webhook URL (Discord, Slack or Teams), optional</div>
      <input type="url" name="webhook_url" placeholder="https://discord.com/api/webhooks/…">
    </div>
    <div class="row">
      <button type="button" class="left" id="testBtn">Send test alert</button>
      <span id="testResult"></span>
      <button value="cancel" formnovalidate>Cancel</button>
      <button class="primary" id="saveSettings" value="save">Save</button>
    </div>
  </form>
</dialog>

<script>
let data = { devices: [], wan: {} }, events = [], filter = "all", pollTimer;
const expanded = new Set(), histories = {};

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = id => document.getElementById(id);

function ago(iso) {
  if (!iso) return "never";
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return new Date(iso).toLocaleDateString();
}
const when = iso => {
  const d = new Date(iso), today = new Date().toDateString() === d.toDateString();
  return today ? d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : d.toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
};
const ms = v => v == null ? "—" : v < 1 ? "<1 ms" : `${Math.round(v)} ms`;
const pct = v => v == null ? "—" : `${(v * 100).toFixed(v >= 0.999 || v === 0 ? 0 : 1)}%`;
// "3d 4h", "2h 15m", "12m", "<1m"
function duration(ms) {
  const m = Math.floor(ms / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (d) return `${d}d ${h % 24}h`;
  if (h) return `${h}h ${m % 60}m`;
  return m ? `${m}m` : "<1m";
}
const onlineFor = x => x.online && x.online_since ? Date.now() - Date.parse(x.online_since) : null;
const fallbackName = x => x.discovered_name || (x.vendor ? `${x.vendor} device` : x.private_mac ? "Device with private MAC" : "Unnamed device");

const BELL = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';

// Latency over the last 24h. Gaps (offline or no ping reply) break the line.
function spark(points, w = 220, h = 36) {
  if (!points?.length) return "";
  const end = Date.now(), start = end - 864e5;
  const vals = points.map(p => p.latency_ms).filter(v => v != null);
  const max = Math.max(5, ...vals);
  let d = "", pen = false;
  for (const p of points) {
    if (p.latency_ms == null) { pen = false; continue; }
    const x = ((new Date(p.ts) - start) / (end - start)) * w, y = h - 2 - (p.latency_ms / max) * (h - 4);
    d += `${pen ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`;
    pen = true;
  }
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Latency over the last 24 hours, peak ${Math.round(max)} ms">
    <line x1="0" y1="${h - 1}" x2="${w}" y2="${h - 1}" stroke="var(--border)"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}

const EVENT_TEXT = {
  new: ["New device joined", "new"], online: ["Came online", "on"], offline: ["Went offline", ""],
  internet_down: ["Internet connection lost", "down"], internet_up: ["Internet connection restored", "on"],
};
function eventItem(e, withName = true) {
  const [text, cls] = EVENT_TEXT[e.kind] || [e.kind, ""];
  const who = withName && e.name ? `<b>${esc(e.name)}</b> · ` : "";
  return `<li><span class="dot ${cls}"></span><span>${who}${text}${e.ip && withName ? ` <span class="sub mono">${esc(e.ip)}</span>` : ""}</span><span class="when">${when(e.ts)}</span></li>`;
}

function details(x) {
  const info = [
    ["Device type", x.device_type],
    ["Manufacturer", x.vendor || (x.private_mac ? "Unknown: this device uses a private (randomized) MAC address, common on phones" : null)],
    ["Model", x.model],
    ["Device name", x.friendly_name],
    ["mDNS / Bonjour name", x.mdns_name],
    ["NetBIOS name", x.netbios_name],
    ["DNS name", x.hostname],
    ["Operating system", x.os_hint && (x.is_self ? x.os_hint : `${x.os_hint} (guessed from ping TTL ${x.ttl})`)],
    ["Advertised services", x.services],
    ["Online since", x.online && x.online_since && new Date(x.online_since).toLocaleString()],
    ["First seen", x.first_seen && new Date(x.first_seen).toLocaleString()],
  ].filter(([, v]) => v);
  const h = histories[x.id];
  const hist = !h ? '<div class="sub">Loading history…</div>' : `
    <div class="uptime">
      <div><div class="label">Uptime 24h</div><b>${pct(h.uptime_24h)}</b></div>
      <div><div class="label">Uptime 7d</div><b>${pct(h.uptime_7d)}</b></div>
    </div>
    ${h.latency.some(p => p.latency_ms != null) ? `<div class="label">Latency, last 24h</div>${spark(h.latency, 260, 40)}` : ""}
    <div class="label" style="margin-top:12px">Status changes</div>
    <ul class="events compact">${h.events.map(e => eventItem(e, false)).join("") || '<li class="sub">None yet</li>'}</ul>`;
  return `<div class="details-grid"><dl>${info.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl><div>${hist}</div></div>`;
}

const api = (path, opts = {}) => fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });

async function loadHistory(id) {
  try { histories[id] = await (await api(`/api/devices/${id}/history`)).json(); render(); } catch {}
}

async function load() {
  clearTimeout(pollTimer);
  try {
    [data, { events }] = await Promise.all([api("/api/devices").then(r => r.json()), api("/api/events").then(r => r.json())]);
    render();
    expanded.forEach(loadHistory);
  } catch (e) {
    $("meta").textContent = "Can't reach the netmon server.";
  }
  pollTimer = setTimeout(load, data.scanning ? 2000 : 10000);
}

// ---- columns. Each has a header, a cell renderer and a sort value; `desc` columns start
// high-to-low on first click, and blanks always sort last. `locked` columns can move but not hide.
const ipNum = x => x.ip.split(".").reduce((n, p) => n * 256 + Number(p), 0);
function nameCell(x) {
  // Second line: whatever the user's label is hiding, plus what kind of device this is.
  const sub = [x.label && x.discovered_name, x.device_type || x.model || (x.discovered_name ? x.vendor : null)].filter(Boolean).join(" · ");
  return `<td class="name">
    <input value="${esc(x.label)}" placeholder="${esc(fallbackName(x))}" data-id="${x.id}" aria-label="Device name">
    ${x.is_self ? '<span class="badge me">This PC</span>' : ""}${x.is_new ? '<span class="badge new">NEW</span>' : ""}
    ${x.private_mac ? '<span class="badge priv" title="Randomized MAC address, common on phones">Private MAC</span>' : ""}
    ${sub ? `<div class="host">${esc(sub)}</div>` : ""}
  </td>`;
}
const COLUMNS = [
  { key: "status", label: "Status", get: x => x.online ? 0 : 1,
    cell: x => `<td><span class="status ${x.online ? "on" : ""}"><span class="dot"></span>${x.online ? "Online" : "Offline"}</span></td>` },
  { key: "name", label: "Name", locked: true, get: x => x.label || fallbackName(x), cell: nameCell },
  { key: "ip", label: "IP address", get: ipNum, cell: x => `<td class="mono">${esc(x.ip)}</td>` },
  { key: "mac", label: "MAC address", get: x => x.mac, cell: x => `<td class="mono">${esc(x.mac || "—")}</td>` },
  { key: "latency", label: "Latency", get: x => x.online ? x.latency_ms : null,
    cell: x => `<td class="num">${x.online ? ms(x.latency_ms) : "—"}</td>` },
  { key: "uptime", label: "Uptime 24h", desc: true, get: x => x.uptime_24h, cell: x => `<td class="num">${pct(x.uptime_24h)}</td>` },
  { key: "onlinefor", label: "Online for", desc: true, title: "How long the device has been online without a break", get: onlineFor,
    cell: x => `<td class="num" title="${x.online && x.online_since ? "Online since " + esc(new Date(x.online_since).toLocaleString()) : ""}">${onlineFor(x) == null ? "—" : duration(onlineFor(x))}</td>` },
  { key: "seen", label: "Last seen", desc: true, get: x => x.online ? Infinity : Date.parse(x.last_seen),
    cell: x => `<td title="${esc(x.last_seen)}">${x.online ? "now" : ago(x.last_seen)}</td>` },
];
const COL = Object.fromEntries(COLUMNS.map(c => [c.key, c]));

// Column layout, remembered per browser. Unknown keys from an older version are dropped and
// columns added since are appended, so a saved layout never breaks the table.
const defaultLayout = () => ({ order: COLUMNS.map(c => c.key), hidden: [] });
let layout = defaultLayout();
try {
  const saved = JSON.parse(localStorage.getItem("netmon.columns"));
  if (saved && Array.isArray(saved.order) && Array.isArray(saved.hidden)) {
    const order = saved.order.filter(k => COL[k]);
    layout = {
      order: [...new Set([...order, ...COLUMNS.map(c => c.key)])],
      hidden: saved.hidden.filter(k => COL[k] && !COL[k].locked),
    };
  }
} catch {}
const visibleColumns = () => layout.order.filter(k => !layout.hidden.includes(k)).map(k => COL[k]);

let sort = { key: "ip", dir: 1 };
try {
  const saved = JSON.parse(localStorage.getItem("netmon.sort"));
  if (saved && COL[saved.key] && Math.abs(saved.dir) === 1) sort = saved;
} catch {}

function compare(a, b) {
  const va = COL[sort.key].get(a), vb = COL[sort.key].get(b);
  if ((va == null) !== (vb == null)) return va == null ? 1 : -1;
  if (va != null && va !== vb) {
    const order = typeof va === "string" ? va.localeCompare(vb, undefined, { numeric: true, sensitivity: "base" }) : va < vb ? -1 : 1;
    if (order) return order * sort.dir;
  }
  return ipNum(a) - ipNum(b);  // stable tie-break so rows don't jump between polls
}

function renderSortHeaders() {
  document.querySelectorAll("button.sort").forEach(b => {
    const on = b.dataset.sort === sort.key;
    b.parentElement.setAttribute("aria-sort", on ? (sort.dir === 1 ? "ascending" : "descending") : "none");
    b.querySelector(".arrow").textContent = on ? (sort.dir === 1 ? "▲" : "▼") : "";
  });
}

function renderHead() {
  $("headRow").innerHTML = '<th class="chevcell"></th>' + visibleColumns().map(c =>
    `<th aria-sort="none"><button class="sort" data-sort="${c.key}"${c.title ? ` title="${esc(c.title)}"` : ""}>${esc(c.label)}<span class="arrow"></span></button></th>`
  ).join("") + "<th></th>";
  renderSortHeaders();
}

const saveSort = () => { try { localStorage.setItem("netmon.sort", JSON.stringify(sort)); } catch {} };

document.querySelector("thead").addEventListener("click", e => {
  const key = e.target.closest("button.sort")?.dataset.sort;
  if (!key) return;
  sort = sort.key === key ? { key, dir: -sort.dir } : { key, dir: COL[key].desc ? -1 : 1 };
  saveSort();
  render();
});

// ---- column menu
function applyLayout(focus) {
  try { localStorage.setItem("netmon.columns", JSON.stringify(layout)); } catch {}
  // Sorting by a column you can't see is confusing, so fall back to IP order.
  if (layout.hidden.includes(sort.key)) { sort = { key: "ip", dir: 1 }; saveSort(); }
  renderHead();
  renderColMenu();
  render();
  if (focus) $("colList").querySelector(focus)?.focus();
}

function renderColMenu() {
  const n = layout.order.length;
  $("colList").innerHTML = layout.order.map((k, i) => {
    const c = COL[k], shown = !layout.hidden.includes(k);
    return `<li draggable="true" data-key="${k}">
      <span class="handle" aria-hidden="true" title="Drag to reorder">⠿</span>
      <label><input type="checkbox" data-toggle="${k}" ${shown ? "checked" : ""} ${c.locked ? "disabled" : ""}>
        ${esc(c.label)}${c.locked ? " <small>always shown</small>" : ""}</label>
      <button class="move" data-move="${k}" data-dir="-1" aria-label="Move ${esc(c.label)} up" ${i === 0 ? "disabled" : ""}>▲</button>
      <button class="move" data-move="${k}" data-dir="1" aria-label="Move ${esc(c.label)} down" ${i === n - 1 ? "disabled" : ""}>▼</button>
    </li>`;
  }).join("");
}

function moveColumn(key, index) {
  const order = layout.order.filter(k => k !== key);
  order.splice(Math.max(0, Math.min(index, order.length)), 0, key);
  layout.order = order;
}

function setMenuOpen(open) {
  $("colMenu").hidden = !open;
  $("colBtn").setAttribute("aria-expanded", String(open));
  if (open) { renderColMenu(); $("colList").querySelector("input:not([disabled])")?.focus(); }
}
$("colBtn").onclick = () => setMenuOpen($("colMenu").hidden);
$("colDone").onclick = () => { setMenuOpen(false); $("colBtn").focus(); };
$("colReset").onclick = () => { layout = defaultLayout(); applyLayout(); };
document.addEventListener("click", e => {
  // composedPath() is captured at dispatch, so it still holds the menu even when the clicked
  // arrow was replaced by a re-render (and is no longer in the document).
  if (!$("colMenu").hidden && !e.composedPath().some(n => n.id === "colMenu" || n.id === "colBtn")) setMenuOpen(false);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("colMenu").hidden) { setMenuOpen(false); $("colBtn").focus(); }
});

const colList = $("colList");
colList.addEventListener("change", e => {
  const key = e.target.dataset.toggle;
  if (!key) return;
  layout.hidden = e.target.checked ? layout.hidden.filter(k => k !== key) : [...layout.hidden, key];
  applyLayout(`[data-toggle="${key}"]`);
});
colList.addEventListener("click", e => {
  const btn = e.target.closest("button.move");
  if (!btn) return;
  const key = btn.dataset.move, dir = Number(btn.dataset.dir);
  moveColumn(key, layout.order.indexOf(key) + dir);
  const i = layout.order.indexOf(key);
  // Keep keyboard focus on the arrow that was pressed, or its partner once it hits an end.
  const atEnd = (dir < 0 && i === 0) || (dir > 0 && i === layout.order.length - 1);
  applyLayout(`[data-move="${key}"][data-dir="${atEnd ? -dir : dir}"]`);
});

// Drag and drop within the menu (mouse). The arrows cover keyboard and touch.
let dragKey = null;
const clearDropMarks = () => colList.querySelectorAll("li").forEach(li => li.classList.remove("drop-before", "drop-after", "dragging"));
colList.addEventListener("dragstart", e => {
  const li = e.target.closest("li");
  if (!li) return;
  dragKey = li.dataset.key;
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", dragKey);
  li.classList.add("dragging");
});
colList.addEventListener("dragover", e => {
  const li = e.target.closest("li");
  if (!dragKey || !li) return;
  e.preventDefault();
  const after = e.clientY > li.getBoundingClientRect().top + li.offsetHeight / 2;
  colList.querySelectorAll("li").forEach(x => x.classList.remove("drop-before", "drop-after"));
  if (li.dataset.key !== dragKey) li.classList.add(after ? "drop-after" : "drop-before");
});
colList.addEventListener("drop", e => {
  const li = e.target.closest("li");
  if (!dragKey || !li) return;
  e.preventDefault();
  if (li.dataset.key !== dragKey) {
    const after = e.clientY > li.getBoundingClientRect().top + li.offsetHeight / 2;
    const target = layout.order.filter(k => k !== dragKey).indexOf(li.dataset.key);
    moveColumn(dragKey, target + (after ? 1 : 0));
    applyLayout();
  }
  dragKey = null;
  clearDropMarks();
});
colList.addEventListener("dragend", () => { dragKey = null; clearDropMarks(); });

function renderConnection() {
  const w = data.wan || {}, down = w.state === "down", unknown = w.state == null;
  $("internet").className = `panel ${down ? "down" : ""}`;
  $("internet").innerHTML = `
    <span class="dot ${unknown ? "" : down ? "down" : "on"}"></span>
    <div><div class="what">Internet ${unknown ? "checking…" : down ? "down" : "online"}</div>
    <div class="stats">${down ? "No reply from 1.1.1.1 or 8.8.8.8" : ms(w.internet_ms)} · ${pct(w.uptime_24h)} up today</div></div>
    ${spark(w.latency, 140, 32)}`;
  const routerUp = w.gateway_ms != null;
  $("router").innerHTML = `
    <span class="dot ${w.gateway ? (routerUp ? "on" : "down") : ""}"></span>
    <div><div class="what">Router ${w.gateway ? `<span class="sub mono">${esc(w.gateway)}</span>` : ""}</div>
    <div class="stats">${!w.gateway ? "checking…" : routerUp ? ms(w.gateway_ms) : "not answering"}</div></div>`;
}

function render() {
  const d = data.devices;
  $("cAll").textContent = d.length;
  $("cOn").textContent = d.filter(x => x.online).length;
  $("cOff").textContent = d.filter(x => !x.online).length;
  $("cNew").textContent = d.filter(x => x.is_new).length;
  $("cWatch").textContent = d.filter(x => x.watch).length;

  $("meta").textContent = `${data.subnet} · ${data.scanning ? "Scanning…" : "Last scan " + ago(data.last_scan)} · rescans every ${data.interval}s`;
  $("scanBtn").disabled = data.scanning;
  $("scanBtn").textContent = data.scanning ? "Scanning…" : "Scan now";
  renderConnection();
  $("activity").innerHTML = events.map(e => eventItem(e)).join("") || '<li class="sub">Nothing yet. Status changes appear here.</li>';

  const q = $("q").value.trim().toLowerCase();
  const match = { all: () => true, online: x => x.online, offline: x => !x.online, new: x => x.is_new, watched: x => x.watch };
  const shown = d.filter(x => match[filter](x) &&
    (!q || [x.label, x.discovered_name, x.vendor, x.model, x.device_type, x.ip, x.mac].some(v => (v || "").toLowerCase().includes(q))));
  shown.sort(compare);
  renderSortHeaders();

  // Don't redraw under the user while they're editing a name.
  if (document.activeElement?.matches(".name input")) return;

  const cols = visibleColumns();
  $("rows").innerHTML = shown.map(x => {
    const open = expanded.has(x.id);
    return `
    <tr class="dev ${x.online ? "" : "off"} ${open ? "open" : ""}" data-row="${x.id}">
      <td class="chevcell"><span class="chev">›</span></td>
      ${cols.map(c => c.cell(x)).join("")}
      <td class="actions">
        ${x.is_new ? `<button data-ack="${x.id}">Seen</button>` : ""}
        <button class="bell" data-watch="${x.id}" aria-pressed="${x.watch}" title="${x.watch ? "Alerting when this goes offline. Click to stop." : "Alert me when this goes offline"}">${BELL}</button>
        <button class="forget" data-forget="${x.id}" title="Remove from the list">Forget</button>
      </td>
    </tr>
    ${open ? `<tr class="details"><td colspan="${cols.length + 2}">${details(x)}</td></tr>` : ""}`;
  }).join("");
  $("empty").hidden = shown.length > 0;
}

$("scanBtn").onclick = async () => {
  await api("/api/scan", { method: "POST" });
  data.scanning = true;
  render();
  setTimeout(load, 500);
};
$("ackAll").onclick = async () => { await api("/api/devices/ack", { method: "POST" }); load(); };
$("q").oninput = render;

document.querySelectorAll(".card").forEach(c => c.onclick = () => {
  document.querySelectorAll(".card").forEach(x => x.classList.toggle("active", x === c));
  filter = c.dataset.filter;
  render();
});

$("rows").addEventListener("click", async e => {
  const btn = e.target.closest("button");
  if (btn?.dataset.ack) { await api(`/api/devices/${btn.dataset.ack}/ack`, { method: "POST" }); return load(); }
  if (btn?.dataset.watch) {
    const on = btn.getAttribute("aria-pressed") !== "true";
    await api(`/api/devices/${btn.dataset.watch}/watch`, { method: "POST", body: JSON.stringify({ watch: on }) });
    return load();
  }
  if (btn?.dataset.forget) {
    if (confirm("Forget this device and its history? It will reappear as new if it's seen again.")) {
      await api(`/api/devices/${btn.dataset.forget}`, { method: "DELETE" });
      load();
    }
    return;
  }
  const row = e.target.closest("tr.dev");
  if (row && !btn && !e.target.matches("input")) {
    const id = Number(row.dataset.row);
    if (expanded.has(id)) expanded.delete(id); else { expanded.add(id); loadHistory(id); }
    render();
  }
});
$("rows").addEventListener("change", async e => {
  if (!e.target.matches(".name input")) return;
  await api(`/api/devices/${e.target.dataset.id}/label`, { method: "POST", body: JSON.stringify({ label: e.target.value }) });
  e.target.blur();
  load();
});
$("rows").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches(".name input")) e.target.blur(); });

// ---- alert settings
const form = $("settingsForm");
function formSettings() {
  const s = {};
  for (const el of form.elements) if (el.name) s[el.name] = el.type === "checkbox" ? el.checked : el.value;
  return s;
}
$("settingsBtn").onclick = async () => {
  const s = await (await api("/api/settings")).json();
  for (const el of form.elements) if (el.name) el.type === "checkbox" ? (el.checked = s[el.name]) : (el.value = s[el.name]);
  $("testResult").textContent = "";
  $("settings").showModal();
};
$("settings").addEventListener("close", async () => {
  if ($("settings").returnValue === "save") await api("/api/settings", { method: "POST", body: JSON.stringify(formSettings()) });
});
$("testBtn").onclick = async () => {
  $("testResult").textContent = "Sending…";
  await api("/api/settings", { method: "POST", body: JSON.stringify(formSettings()) });
  await api("/api/notify/test", { method: "POST" });
  $("testResult").textContent = "Sent";
};

renderHead();
load();
</script>
</body>
